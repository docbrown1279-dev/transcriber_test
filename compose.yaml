# Demo runtime (D5). Secrets stay on the host — never bake into the image.
#
# Local:
#   cp .env.example .env   # fill keys
#   docker compose up -d --build
#
# Server (Caddy on external proxy-net):
#   docker network create proxy-net   # once, if missing
#   scp .env; docker compose up -d --build
#   Caddy upstream: transcriber:8000 (same Docker network)
#
# Health: http://127.0.0.1:8000/healthz (published port) or via Caddy

services:
  transcriber:
    build:
      context: .
      target: runtime
    image: transcriber:runtime
    ports:
      - "${TRANSCRIBER_PUBLISH_PORT:-8000}:8000"
    # Soft gate aligned with G5 / demo box
    cpus: 2
    mem_limit: 8g
    env_file:
      # Host secrets only. Create from .env.example; on server prefer scp to this path
      # or: COMPOSE_ENV_FILE=/etc/transcriber/transcriber.env docker compose up -d
      - path: ${COMPOSE_ENV_FILE:-.env}
        required: false
    environment:
      TRANSCRIBER_STORAGE_ROOT: /var/transcriber
      # When env_file is used, keys are already in process env; optional explicit dotenv path:
      # TRANSCRIBER_DOTENV: /run/secrets/transcriber.env
    volumes:
      - transcriber-var:/var/transcriber
      - transcriber-hf-cache:/home/app/.cache
    networks:
      - proxy-net
    restart: unless-stopped

volumes:
  transcriber-var:
  transcriber-hf-cache:

networks:
  proxy-net:
    external: true
