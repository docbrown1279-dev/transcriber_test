# Shared defaults for all profiles (speech + chunking + runtime).
# Profile overlays live in config/profiles/{demo,dev,prod}.yaml.

app:
  # Active overlay: demo | dev | prod. Switch here; do not put the profile in .env.
  profile: demo
  storage_root: ./var
  log_level: INFO

# --- audio (format + gain) ---
audio:
  max_minutes: 30
  max_file_size_mb: 250
  sample_rate: 16000
  channels: 1
  gain:
    rms_threshold_dbfs: -30.0
    target_dbfs: -23.0
    max_db: 18.0
    peak_ceiling_dbfs: -1.0
  asr_per_turn_gain: true
  vad_preprocess:
    # D1 Silero parity T2: raw 16 kHz into Silero (no file-level dynaudnorm)
    enabled: false
    ffmpeg_af: "dynaudnorm=f=150:g=7:p=0.9"

# --- vad ---
vad:
  engine: silero
  onnx_threads: 2
  # Stage 1f speech_timestamps defaults (snakers4 Silero v5 + context)
  threshold: 0.45
  neg_threshold: 0.30
  min_speech_ms: 200
  min_silence_ms: 350
  fallback: disabled

# --- diarization ---
diarization:
  engine: wespeaker_onnx
  device: cpu
  onnx_threads: 2
  merge:
    # T2 soft glue (eval/d1/5): mild absorb, slightly wider VAD premerge
    same_speaker_gap_sec: 0.3
    absorb_turn_shorter_than_sec: 1.0
    min_hole_sec: 0.5
    vad_premerge_gap_sec: 0.5
  embed:
    min_sec: 0.4
    window_sec: 1.5
    step_sec: 0.75
    # 0.80 oversplits full meetings (~15 ids on voice_002 T2 VAD); 0.85 → ~5
    cluster_distance_threshold: 0.85

# --- asr ---
asr:
  engine: gigaam_v3_rnnt
  device: cpu
  max_segment_seconds: 25
  subprocess: true

# --- correction ---
correction:
  enabled: true
  mode: suggest_only
  base_ru_dictionary: true
  domain_dictionary: false
  levenshtein_auto_replace: false
  manual_review: false
  min_confidence: 0.6

# --- chunking ---
chunking:
  default_mode: speaker_similarity
  chunker: packing_c
  embedding_model: rubert_tiny2
  similarity_threshold: 0.70
  packing_max_gap_sec: 2.0
  packing_target_words: [40, 80]
  merge_max_duration_sec: 180
  absorb_shorter_than_sec: 5.0
  target_chapter_sec: [45, 180]
  target_chapters_per_minute: [0.4, 0.8]
  warning_chapters_per_minute: [0.3, 1.0]
  late_chunking:
    enabled: false
    provider: disabled

# --- pipeline TOC (D4.1) ---
pipeline:
  # a = ASR all → batch titles; b = ASR slices → title when next chapter appears
  toc_mode: b

# --- runtime ---
limits:
  requests_per_ip_per_day: 5
  max_concurrent_jobs: 1
  result_ttl_hours: 24
  queue_max_size: 4

ui:
  type: jinja
  show_progress: true
  progress_transport: polling
  allow_editing: true
  allow_player: true
  draft_warning: true
  summary_max_calls: 2  # on-demand report button; LLM completions per job
