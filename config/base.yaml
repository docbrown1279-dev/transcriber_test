# Shared defaults for all profiles (speech + chunking + runtime).
# Profile overlays live in config/profiles/{demo,dev,prod}.yaml.

app:
  profile: demo
  storage_root: ./var
  log_level: INFO

# --- audio (format + gain) ---
audio:
  max_minutes: 15
  max_file_size_mb: 250
  sample_rate: 16000
  channels: 1
  gain:
    rms_threshold_dbfs: -30.0
    target_dbfs: -23.0
    max_db: 18.0
    peak_ceiling_dbfs: -1.0
  asr_per_turn_gain: true
  vad_preprocess:
    # D1 Silero parity T2: raw 16 kHz into Silero (no file-level dynaudnorm)
    enabled: false
    ffmpeg_af: "dynaudnorm=f=150:g=7:p=0.9"

# --- vad ---
vad:
  engine: silero
  # Stage 1f speech_timestamps defaults (snakers4 Silero v5 + context)
  threshold: 0.45
  neg_threshold: 0.30
  min_speech_ms: 200
  min_silence_ms: 350
  fallback: disabled

# --- diarization ---
diarization:
  engine: wespeaker_onnx
  device: cpu
  onnx_threads: 2
  merge:
    # T2 soft glue (eval/d1/5): mild absorb, slightly wider VAD premerge
    same_speaker_gap_sec: 0.3
    absorb_turn_shorter_than_sec: 1.0
    min_hole_sec: 0.5
    vad_premerge_gap_sec: 0.5
  embed:
    min_sec: 0.4
    window_sec: 1.5
    step_sec: 0.75
    cluster_distance_threshold: 0.80

# --- asr ---
asr:
  engine: gigaam_v3_rnnt
  device: cpu
  max_segment_seconds: 25
  subprocess: true

# --- correction ---
correction:
  enabled: true
  mode: suggest_only
  base_ru_dictionary: true
  domain_dictionary: false
  levenshtein_auto_replace: false
  manual_review: false
  min_confidence: 0.6

# --- chunking ---
chunking:
  default_mode: speaker_similarity
  chunker: packing_c
  embedding_model: rubert_tiny2
  similarity_threshold: 0.70
  packing_max_gap_sec: 2.0
  target_chapter_sec: [45, 180]
  target_chapters_per_minute: [0.4, 0.8]
  late_chunking:
    enabled: false
    provider: disabled

# --- llm (defaults; profiles override provider/model) ---
llm:
  mode: api
  provider: gemini
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY
  timeout_sec: 60
  max_calls_per_job: 20
  temperature: 0.2
  debug_reasoning: false
  prompts:
    title: title_p1_v1
    extract: extract_v1
    report: report_v1

# --- runtime ---
limits:
  requests_per_ip_per_day: 1
  max_concurrent_jobs: 1
  result_ttl_hours: 24
  queue_max_size: 4

ui:
  type: jinja
  show_progress: true
  progress_transport: polling
  allow_editing: false
  allow_player: false
  draft_warning: true
