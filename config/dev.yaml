app:
  profile: dev
  storage_root: ./var
  log_level: DEBUG

audio:
  max_minutes: null
  max_file_size_mb: null
  sample_rate: 16000
  channels: 1
  gain_rms_threshold_dbfs: -30.0
  gain_target_dbfs: -23.0
  gain_max_db: 18.0
  gain_peak_ceiling_dbfs: -1.0

vad:
  engine: silero
  min_speech_ms: 200
  fallback: ten_fallback

diarization:
  engine: pyannote31
  device: cpu
  onnx_threads: 2
  merge_same_speaker_gap_sec: 0.3
  absorb_turn_shorter_than_sec: 1.0
  min_hole_sec: 0.5
  vad_premerge_gap_sec: 0.3
  min_embed_sec: 0.4
  embed_window_sec: 1.5
  embed_step_sec: 0.75
  cluster_distance_threshold: 0.80

asr:
  engine: gigaam_v3_rnnt
  device: cpu
  max_segment_seconds: 25
  subprocess: true

correction:
  enabled: true
  mode: suggest_only
  base_ru_dictionary: true
  domain_dictionary: false
  levenshtein_auto_replace: false
  manual_review: true
  min_confidence: 0.6

chunking:
  default_mode: both
  chunker: packing_c
  embedding_model: rubert_tiny2
  similarity_threshold: 0.70
  packing_max_gap_sec: 2.0
  target_chapter_sec: [45, 180]
  target_chapters_per_minute: [0.4, 0.8]
  late_chunking:
    enabled: false
    provider: disabled

llm:
  mode: local
  provider: local_llama
  model_path: ./models/Qwen3-8B-Q5_K_M.gguf
  n_ctx: 8192
  threads: 4
  max_calls_per_job: null
  temperature: 0.2
  debug_reasoning: false
  prompts:
    title: title_p1_v1
    extract: extract_v1
    report: report_v1

limits:
  requests_per_ip_per_day: null
  max_concurrent_jobs: null
  result_ttl_hours: null
  queue_max_size: null

ui:
  type: api_only
  show_progress: false
  progress_transport: polling
  allow_editing: false
  allow_player: false
  draft_warning: true
