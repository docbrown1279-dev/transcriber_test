# demo overlay — public demo limits and light ONNX stack
app:
  profile: demo

audio:
  # Ship gate: 15 min trim (full meeting TTFT too long on 2 vCPU).
  max_minutes: 15

vad:
  fallback: disabled

diarization:
  engine: wespeaker_onnx
  device: cpu
  onnx_threads: 2

pipeline:
  toc_mode: b
  ttft_split: true

llm:
  mode: api
  backend: qwen

limits:
  requests_per_ip_per_day: 5
  max_concurrent_jobs: 1
  result_ttl_hours: 24
  queue_max_size: 4

ui:
  type: jinja
  show_progress: true
  allow_editing: true
  allow_player: true
  draft_warning: true
  summary_max_calls: 2
