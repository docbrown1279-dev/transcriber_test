# dev overlay — flexible experiments with API LLMs
app:
  profile: dev
  log_level: DEBUG

audio:
  max_minutes: null
  max_file_size_mb: null

vad:
  fallback: ten_fallback

diarization:
  engine: pyannote31

correction:
  manual_review: true

chunking:
  default_mode: both

llm:
  mode: api
  backend: gemini

limits:
  requests_per_ip_per_day: null
  max_concurrent_jobs: null
  result_ttl_hours: null
  queue_max_size: null

ui:
  type: api_only
  show_progress: false
