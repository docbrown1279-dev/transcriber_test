# prod overlay — local processing, longer audio, richer UI
app:
  profile: prod

audio:
  max_minutes: 120
  max_file_size_mb: 2000

vad:
  fallback: disabled

diarization:
  engine: pyannote31

correction:
  domain_dictionary: true
  manual_review: true

chunking:
  late_chunking:
    enabled: true
    provider: late_chunking_jina

llm:
  mode: local
  provider: local_llama
  model: null
  model_path: ./models/Qwen3-8B-Q5_K_M.gguf
  api_key_env: null
  timeout_sec: null
  max_calls_per_job: null
  n_ctx: 8192
  threads: 4

limits:
  requests_per_ip_per_day: null
  max_concurrent_jobs: 2
  result_ttl_hours: null
  queue_max_size: 4

ui:
  type: interactive
  show_progress: true
  allow_editing: true
  allow_player: true
  draft_warning: false
