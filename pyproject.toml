[project]
name = "transcriber"
version = "0.1.0"
description = "Meeting transcriber demo"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "numpy",
    "typer",
]

[project.optional-dependencies]
asr = [
    "gigaam",
    "soundfile>=0.14.0",
    "torch",
    "torchaudio",
]
diarize = [
    "onnxruntime~=1.23.0",
    "scikit-learn>=1.9.0",
    "soundfile>=0.14.0",
    "speakeronnx>=0.0.1",
]
embed = [
    "sentence-transformers>=6.0.1",
]
llm-local = []
llm = [
    "google-genai>=2.22.0",
]

[project.scripts]
transcriber = "transcriber.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "bandit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml.*", "soundfile.*", "gigaam.*", "speakeronnx.*", "onnxruntime.*", "sklearn.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_inputs: tests requiring packed cloud_in/inputs data",
    "requires_llm: tests requiring LLM access or cassettes",
    "slow: tests running heavy processing or long audio",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
gigaam = { git = "https://github.com/salute-developers/GigaAM.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

